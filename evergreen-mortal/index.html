<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Evergreen Mortal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Evergreen (default) palette — also the fallback for every var() below,
       so anything outside #desktop-screen (e.g. Cyber Mail) always renders
       in the original look regardless of in-game settings. */
    :root {
      --bg-app: #0d0d1a;
      --bg-panel: #1a1a2e;
      --bg-inset: #14142280;
      --border: #2a2a4a;
      --text: #ffffff;
      --text-dim: #cccccc;
      --text-mute: #888888;
      --text-faint: #666666;
      --accent: #44ff88;
      --accent-hover: #6bffa3;
      --accent-contrast: #0d0d1a;
      --danger: #ff4466;
      --danger-bg: #2a1420;
      --type-script: #4dd0e1;
      --type-utility: #f2c94c;
      --type-daemon: #b388ff;
      --type-virus: #ff4466;
    }

    html, body {
      background: var(--bg-app);
      color: var(--text);
      font-family: monospace;
      height: 100%;
      overflow: hidden;
    }
    .mail-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .mail-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }
    .mail-back-link {
      color: var(--text-faint);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--ui-font, monospace);
    }
    .mail-back-link:hover { color: var(--accent); }
    .mail-logo {
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .mail-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      background: var(--bg-app);
      color: var(--text);
      font-family: var(--ui-font, monospace);
    }
    .hidden { display: none !important; }

    /* Left nav */
    .mail-sidebar {
      width: 180px;
      flex-shrink: 0;
      background: var(--bg-inset);
      border-right: 1px solid var(--border);
      padding: 16px 10px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      color: var(--accent);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      cursor: default;
    }

    /* Middle: email list */
    .mail-inbox-panel {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .mail-inbox-header {
      padding: 16px 20px 8px;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--text-mute);
    }

    .email-list { list-style: none; padding: 0 12px 12px; }
    .email-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .email-row:hover { border-color: var(--accent); }
    .email-row.selected { border-color: var(--accent); }
    .email-row.unread .email-from { color: var(--accent); font-weight: bold; }
    .email-row.unread .email-subject { color: var(--text); }
    .email-row.unread::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
    }
    .email-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .email-from { font-size: 0.9rem; color: var(--text-dim); }
    .email-date { font-size: 0.75rem; color: var(--text-faint); white-space: nowrap; }
    .email-subject { font-size: 0.85rem; color: var(--text-mute); }
    .email-snippet { font-size: 0.8rem; color: var(--text-faint); }

    .new-arrival { animation: pulse-in 1.4s ease-out 2; }
    @keyframes pulse-in {
      0% { border-color: var(--accent); box-shadow: 0 0 0 0 #44ff8866; }
      100% { border-color: var(--border); box-shadow: 0 0 0 8px #44ff8800; }
    }

    /* Right: reading pane */
    .mail-detail-panel { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .mail-detail-empty { color: var(--text-faint); font-size: 0.85rem; margin-top: 40px; text-align: center; }
    .mail-detail-subject {
      font-size: 1.2rem;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      max-width: 640px;
    }

    .mail-detail-thread { max-width: 640px; }
    .thread-message {
      border-left: 3px solid var(--accent);
      padding: 2px 0 2px 16px;
      margin-bottom: 26px;
    }
    .thread-message.self { border-left-color: var(--text-faint); }
    .thread-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .thread-from-name { color: var(--accent); font-weight: bold; }
    .thread-message.self .thread-from-name { color: var(--text-mute); }
    .thread-addr { color: var(--text-faint); margin-left: 4px; }
    .thread-date { color: var(--text-faint); font-size: 0.75rem; white-space: nowrap; }
    .thread-message p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; margin-bottom: 14px; }

    .mail-detail-action { max-width: 640px; margin-top: 8px; }
    .action-btn {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      border-radius: 4px;
      padding: 12px 20px;
      font-family: var(--ui-font, monospace);
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .action-btn:hover { background: var(--accent-hover); }

    /* Desktop screen */
    #desktop-screen {
      width: 100vw;
      height: 100vh;
      background: url('assets/desktop-bg.jpg') center / cover no-repeat;
      position: relative;
    }
    #desktop-icons {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 84px;
      gap: 6px;
      padding: 10px 4px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }
    .desktop-icon:hover { background: rgba(255, 255, 255, 0.12); }
    .icon-glyph {
      position: relative;
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.85));
    }
    .icon-glyph svg { width: 100%; height: 100%; }
    .icon-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: var(--danger);
      color: #fff;
      font-family: monospace;
      font-size: 0.65rem;
      font-weight: bold;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .icon-label {
      color: #fff;
      font-family: monospace;
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* Windows */
    .window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      min-width: 320px;
      min-height: 220px;
      font-family: var(--ui-font, monospace);
    }
    .window.maximized {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0;
    }
    .window-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 8px 8px 14px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      cursor: move;
      user-select: none;
      flex-shrink: 0;
    }
    .window-title {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-controls { display: flex; gap: 6px; flex-shrink: 0; }
    .window-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      line-height: 1;
      font-family: var(--ui-font, monospace);
      cursor: pointer;
    }
    .window-btn:hover { border-color: var(--accent); color: var(--accent); }
    .window-btn.close:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
    .window-content {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    .window-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
    }
    .window.maximized .window-resize-handle { display: none; }

    /* Settings app */
    .settings-panel {
      flex: 1;
      overflow-y: auto;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: var(--bg-app);
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .settings-row span {
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }
    .settings-row select {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      font-family: var(--ui-font, monospace);
      font-size: 0.8rem;
      min-width: 140px;
      cursor: pointer;
    }
    .settings-row select:focus { outline: none; border-color: var(--accent); }
    .settings-note {
      font-size: 0.75rem;
      color: var(--text-faint);
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 4px;
    }

    /* EverSprint (kanban board) app */
    .board {
      flex: 1;
      display: flex;
      gap: 14px;
      padding: 18px;
      overflow-x: auto;
      background: var(--bg-app);
      font-family: var(--ui-font, monospace);
    }
    .board-column {
      flex: 1;
      min-width: 190px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .board-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--bg-inset);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .board-column-header .action-btn {
      padding: 5px 10px;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }
    .day-btn-pending { background: #f2c94c !important; color: #1a1a1a !important; }
    .day-btn-pending:hover { background: #f7d76c !important; }
    .day-btn-clear { background: #2ecc71 !important; color: #0a1f14 !important; }
    .day-btn-clear:hover { background: #4ee08a !important; }
    .board-column-body {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .board-empty {
      color: var(--text-faint);
      font-size: 0.75rem;
      text-align: center;
      margin-top: 10px;
    }

    /* EverSprint battle UI */
    .sprint-app { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .sprint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sprint-header-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.75rem;
      color: var(--text-mute);
    }
    .sprint-header-stat strong { color: var(--accent); font-size: 1rem; }
    .sprint-hint { flex: 1; color: var(--accent); font-size: 0.75rem; text-align: center; }
    .sprint-day {
      color: var(--text);
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .sprint-day-dots { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
    .sprint-day-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-inset);
      border: 1px solid var(--border);
    }
    .sprint-day-dot.filled { background: var(--accent); border-color: var(--accent); }

    .sprint-card {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sprint-card-name { color: var(--text); font-weight: bold; font-size: 0.8rem; }
    .sprint-card-desc { color: var(--text-faint); font-size: 0.7rem; line-height: 1.4; }
    .sprint-card button {
      align-self: flex-start;
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-family: var(--ui-font, monospace);
      cursor: pointer;
    }
    .sprint-card button:hover { background: var(--accent-hover); }
    .sprint-card button:disabled { opacity: 0.4; cursor: default; }

    .sprint-card[data-type="script"] { border-left: 3px solid var(--type-script); }
    .sprint-card[data-type="utility"] { border-left: 3px solid var(--type-utility); }
    .sprint-card[data-type="daemon"] { border-left: 3px solid var(--type-daemon); }
    .sprint-card[data-type="virus"] { border-left: 3px solid var(--type-virus); }
    .sprint-card[data-rarity="uncommon"] { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15); }
    .sprint-card[data-rarity="rare"] { box-shadow: 0 0 0 1px #f2c94c; }
    .sprint-card-type-tag { font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); }
    .sprint-card-cooldown { font-size: 0.7rem; color: var(--text-faint); }
    .sprint-card.targetable-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }

    .bonus-draft-header { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.03em; margin-bottom: 2px; }
    .bonus-draft-decline { align-self: stretch; }
    .draft-column-note { color: var(--text-faint); font-size: 0.75rem; text-align: center; margin-top: 10px; }

    .sprint-task {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .sprint-task.targetable { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .sprint-task-name { color: var(--text); font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; }
    .sprint-task-meta { color: var(--text-faint); font-size: 0.7rem; }
    .ability-block { margin-top: 4px; }
    .ability-desc { color: var(--text-faint); font-size: 0.65rem; line-height: 1.35; margin-top: 3px; }
    .ability-badge {
      display: inline-block;
      font-size: 0.62rem;
      letter-spacing: 0.03em;
      color: var(--accent);
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .carried-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: normal;
      letter-spacing: 0.03em;
      color: var(--text-mute);
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .reassign-btn {
      display: block;
      margin-top: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-family: var(--ui-font, monospace);
      cursor: pointer;
    }
    .reassign-btn:hover { background: var(--danger); color: var(--accent-contrast); }
    .reassign-btn:disabled { opacity: 0.4; cursor: default; }
    .severity-bar {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin: 4px 0;
    }
    .sprint-performance { min-width: 140px; }
    .performance-bar { width: 140px; }
    .severity-bar-fill { height: 100%; background: var(--danger); }

    .sprint-gameover {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .sprint-gameover strong { color: var(--accent); font-size: 1.3rem; letter-spacing: 0.03em; }

    /* Sprint Summary hub */
    .sprint-summary {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px 28px;
      overflow-y: auto;
      font-family: var(--ui-font, monospace);
    }
    .summary-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .summary-title { color: var(--accent); font-size: 1.2rem; font-weight: bold; letter-spacing: 0.02em; }
    .summary-performance { color: var(--text-dim); font-size: 0.9rem; }
    .summary-positive { color: var(--accent); }
    .summary-negative { color: var(--danger); }
    .summary-columns {
      flex: 1;
      display: flex;
      gap: 16px;
    }
    .summary-section {
      flex: 1;
      min-width: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .summary-section-title { color: var(--text-mute); font-size: 0.75rem; letter-spacing: 0.04em; margin-bottom: 4px; }
    .summary-section-body { display: flex; flex-direction: column; gap: 8px; }
    .task-status-tag { font-size: 0.7rem; font-weight: normal; margin-left: 6px; }
    .sprint-task-cleared { opacity: 0.85; cursor: default; }
    .summary-actions { display: flex; justify-content: flex-end; gap: 10px; }

    /* Deck editor (file-system metaphor) */
    .file-browser {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px 28px;
      overflow: hidden;
      font-family: var(--ui-font, monospace);
    }
    .file-browser-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .file-folders { flex: 1; display: flex; gap: 16px; overflow: hidden; }
    .file-folder {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .file-folder-header {
      padding: 12px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--bg-inset);
      border-bottom: 1px solid var(--border);
    }
    .file-folder-body {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
      overflow-y: auto;
    }
    .file-folder-body.drag-over { background: var(--bg-inset); box-shadow: inset 0 0 0 2px var(--accent); }
    .file-tile {
      position: relative;
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 6px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: grab;
      user-select: none;
    }
    .file-tile:active { cursor: grabbing; }
    .file-tile.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .file-tile[data-type="script"] { border-top: 3px solid var(--type-script); }
    .file-tile[data-type="utility"] { border-top: 3px solid var(--type-utility); }
    .file-tile[data-type="daemon"] { border-top: 3px solid var(--type-daemon); }
    .file-tile[data-type="virus"] { border-top: 3px solid var(--type-virus); }
    .file-icon { font-size: 1.4rem; line-height: 1; }
    .file-name { color: var(--text-dim); font-size: 0.65rem; text-align: center; line-height: 1.3; }
    .file-count {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 0.6rem;
      font-weight: bold;
      line-height: 1;
      border-radius: 999px;
    }

    .file-tooltip {
      position: absolute;
      transform: translateX(-50%);
      width: 180px;
      background: var(--bg-panel);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 10px 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      z-index: 40;
      text-align: left;
      cursor: default;
    }
    .file-tooltip-name { color: var(--accent); font-weight: bold; font-size: 0.75rem; margin-bottom: 4px; }
    .file-tooltip-desc { color: var(--text-dim); font-size: 0.7rem; line-height: 1.4; }

    /* ---- Theme overrides (scoped so Cyber Mail is never affected) ---- */
    #desktop-screen[data-theme="dark"] {
      --bg-app: #141414;
      --bg-panel: #1e1e1e;
      --bg-inset: #1a1a1a80;
      --border: #333333;
      --text: #f2f2f2;
      --text-dim: #cccccc;
      --text-mute: #999999;
      --text-faint: #777777;
      --accent: #4da3ff;
      --accent-hover: #7cbcff;
      --accent-contrast: #0a0a0a;
      --danger: #ff5566;
      --danger-bg: #2a1216;
    }
    #desktop-screen[data-theme="light"] {
      --bg-app: #f5f5f7;
      --bg-panel: #ffffff;
      --bg-inset: #eceef180;
      --border: #d8dade;
      --text: #1a1a1a;
      --text-dim: #333333;
      --text-mute: #666666;
      --text-faint: #8a8d94;
      --accent: #1f9d55;
      --accent-hover: #24b863;
      --accent-contrast: #ffffff;
      --danger: #d93a4b;
      --danger-bg: #fbe4e6;
    }

    /* ---- OS overrides: window chrome shape/position + UI font ---- */
    #desktop-screen[data-os="windows"] { --ui-font: 'Segoe UI', Tahoma, Arial, sans-serif; }
    #desktop-screen[data-os="windows"] .window-controls { gap: 0; }
    #desktop-screen[data-os="windows"] .window-btn {
      width: 44px;
      height: 30px;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #desktop-screen[data-os="windows"] .window-btn:hover {
      background: rgba(128, 128, 128, 0.25);
      border-color: transparent;
      color: var(--text);
    }
    #desktop-screen[data-os="windows"] .window-btn.close:hover {
      background: #e81123;
      color: #ffffff;
      border-color: transparent;
    }

    #desktop-screen[data-os="macos"] { --ui-font: -apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif; }
    #desktop-screen[data-os="macos"] .window-titlebar { justify-content: flex-start; padding-left: 12px; }
    #desktop-screen[data-os="macos"] .window-title { order: 2; margin-left: 10px; }
    #desktop-screen[data-os="macos"] .window-controls { order: 1; gap: 8px; }
    #desktop-screen[data-os="macos"] .window-btn.close { order: 1; }
    #desktop-screen[data-os="macos"] .window-btn.minimize { order: 2; }
    #desktop-screen[data-os="macos"] .window-btn.maximize { order: 3; }
    #desktop-screen[data-os="macos"] .window-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      color: transparent;
      font-size: 0.55rem;
    }
    #desktop-screen[data-os="macos"] .window-btn.minimize { background: #ffbd2e; }
    #desktop-screen[data-os="macos"] .window-btn.maximize { background: #28c840; }
    #desktop-screen[data-os="macos"] .window-btn.close { background: #ff5f57; }
    #desktop-screen[data-os="macos"] .window-btn:hover {
      color: rgba(0, 0, 0, 0.55);
      border-color: transparent;
    }
    #desktop-screen[data-os="macos"] .window-btn.minimize:hover { background: #ffbd2e; }
    #desktop-screen[data-os="macos"] .window-btn.maximize:hover { background: #28c840; }
    #desktop-screen[data-os="macos"] .window-btn.close:hover { background: #ff5f57; }

    /* ---- Email client overrides (scoped to windowed mail apps only) ---- */
    #desktop-screen[data-email-client="gmail"] .mail-body {
      --bg-app: #ffffff;
      --bg-panel: #f6f8fc;
      --bg-inset: #f6f8fc;
      --border: #e3e6ea;
      --text: #202124;
      --text-dim: #3c4043;
      --text-mute: #5f6368;
      --text-faint: #80868b;
      --accent: #c5221f;
      --accent-hover: #e14640;
      --accent-contrast: #ffffff;
      font-family: 'Arial', 'Helvetica', sans-serif;
    }
    #desktop-screen[data-email-client="gmail"] .mail-sidebar { border-right: none; }
    #desktop-screen[data-email-client="gmail"] .nav-item { border-radius: 999px; border: none; background: #fce8e6; }
    #desktop-screen[data-email-client="gmail"] .email-row {
      border-radius: 0;
      border: none;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      background: var(--bg-app);
    }
    #desktop-screen[data-email-client="gmail"] .email-row.unread { background: #f2f6fc; }
    #desktop-screen[data-email-client="gmail"] .email-row:hover { border-color: var(--border); box-shadow: inset 0 0 0 1px #e3e6ea; }
    #desktop-screen[data-email-client="gmail"] .email-row.selected { background: #d3e3fd; }
    #desktop-screen[data-email-client="gmail"] .thread-message { border-left-color: var(--accent); }

    #desktop-screen[data-email-client="outlook"] .mail-body {
      --bg-app: #ffffff;
      --bg-panel: #f3f2f1;
      --bg-inset: #f3f2f1;
      --border: #e1dfdd;
      --text: #201f1e;
      --text-dim: #323130;
      --text-mute: #605e5c;
      --text-faint: #8a8886;
      --accent: #0078d4;
      --accent-hover: #106ebe;
      --accent-contrast: #ffffff;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    #desktop-screen[data-email-client="outlook"] .nav-item { border-radius: 2px; }
    #desktop-screen[data-email-client="outlook"] .email-row {
      border-radius: 0;
      border: none;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      background: var(--bg-app);
    }
    #desktop-screen[data-email-client="outlook"] .email-row.unread { border-left-color: var(--accent); }
    #desktop-screen[data-email-client="outlook"] .email-row.selected { background: #edf3fc; border-left-color: var(--accent); }
    #desktop-screen[data-email-client="outlook"] .thread-message { border-left-color: var(--accent); }

    /* ---- Agile board overrides (scoped to the EverSprint board only) ---- */
    #desktop-screen[data-agile-board="jira"] .board {
      --bg-app: #f4f5f7;
      --bg-panel: #ffffff;
      --bg-inset: #f4f5f7;
      --border: #dfe1e6;
      --text: #172b4d;
      --text-dim: #42526e;
      --text-mute: #5e6c84;
      --text-faint: #97a0af;
      --accent: #0052cc;
      --accent-hover: #0065ff;
      --accent-contrast: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #desktop-screen[data-agile-board="jira"] .board-column { border-radius: 3px; }
    #desktop-screen[data-agile-board="jira"] .board-column-header {
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.03em;
    }

    #desktop-screen[data-agile-board="trello"] .board {
      --bg-app: #0079bf;
      --bg-panel: #ebecf0;
      --bg-inset: #ebecf0;
      --border: #d6d9dc;
      --text: #172b4d;
      --text-dim: #172b4d;
      --text-mute: #5e6c84;
      --text-faint: #6b778c;
      --accent: #5aac44;
      --accent-hover: #61bd4f;
      --accent-contrast: #ffffff;
      font-family: 'Trebuchet MS', Arial, sans-serif;
    }
    #desktop-screen[data-agile-board="trello"] .board-column { border-radius: 10px; }
    #desktop-screen[data-agile-board="trello"] .board-column-header { font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="app" class="mail-screen">
    <div class="mail-topbar">
      <a class="mail-back-link" href="../free-games.html">← back</a>
      <div class="mail-logo">CYBER MAIL</div>
    </div>
    <div class="mail-body">
      <div class="mail-sidebar">
        <div class="nav-item">Inbox</div>
      </div>
      <div class="mail-inbox-panel">
        <div class="mail-inbox-header">INBOX</div>
        <ul class="email-list" data-role="email-list"></ul>
      </div>
      <div class="mail-detail-panel">
        <div class="mail-detail-empty" data-role="detail-empty">Select a message to read it.</div>
        <div class="hidden" data-role="detail-content">
          <div class="mail-detail-subject" data-role="detail-subject"></div>
          <div class="mail-detail-thread" data-role="detail-thread"></div>
          <div class="mail-detail-action" data-role="detail-action"></div>
        </div>
      </div>
    </div>
  </div>

  <template id="tmpl-mail-app">
    <div class="mail-body">
      <div class="mail-sidebar">
        <div class="nav-item">Inbox</div>
      </div>
      <div class="mail-inbox-panel">
        <div class="mail-inbox-header">INBOX</div>
        <ul class="email-list" data-role="email-list"></ul>
      </div>
      <div class="mail-detail-panel">
        <div class="mail-detail-empty" data-role="detail-empty">Select a message to read it.</div>
        <div class="hidden" data-role="detail-content">
          <div class="mail-detail-subject" data-role="detail-subject"></div>
          <div class="mail-detail-thread" data-role="detail-thread"></div>
          <div class="mail-detail-action" data-role="detail-action"></div>
        </div>
      </div>
    </div>
  </template>

  <div id="desktop-screen" class="hidden">
    <div id="desktop-icons">
      <div class="desktop-icon" id="icon-mail">
        <div class="icon-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="20" height="16" rx="2" fill="#1a1a2e" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M3 6l9 7 9-7" stroke="#44ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="mail-badge" class="icon-badge hidden"></span>
        </div>
        <div class="icon-label">Evergreen Mail</div>
      </div>
      <div class="desktop-icon" id="icon-settings">
        <div class="icon-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3.2" fill="#1a1a2e" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M21.5 12h-2.4M4.9 12H2.5M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3L5.6 5.6"
              stroke="#44ff88" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="icon-label">Settings</div>
      </div>
      <div class="desktop-icon" id="icon-terminal">
        <div class="icon-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="20" height="18" rx="2" fill="#0d0d1a" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M5.5 8.5l4 3.5-4 3.5" stroke="#44ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 15.5h6.5" stroke="#44ff88" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="icon-label">Terminal</div>
      </div>
      <div class="desktop-icon" id="icon-eversprint">
        <div class="icon-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="20" height="18" rx="2" fill="#1a1a2e" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="9" y1="3" x2="9" y2="21" stroke="#ffffff" stroke-width="1.2"/>
            <line x1="15" y1="3" x2="15" y2="21" stroke="#ffffff" stroke-width="1.2"/>
            <rect x="3.5" y="6" width="4" height="3" rx="0.5" fill="#44ff88"/>
            <rect x="3.5" y="11" width="4" height="3" rx="0.5" fill="#44ff88"/>
            <rect x="10.5" y="6" width="3" height="3" rx="0.5" fill="#44ff88"/>
          </svg>
        </div>
        <div class="icon-label">EverSprint</div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
