<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kramps Games</title>
  <script src="os/os.js"></script>
  <link rel="stylesheet" href="os/os.css">
  <link rel="stylesheet" href="os/site.css">
</head>
<body>
  <div class="window" id="welcome" data-app="Welcome">
    <div class="titlebar">
      <div class="lights"><span class="close"></span><span class="min"></span><span class="max"></span></div>
      <div class="window-title">Welcome</div>
    </div>
    <div class="welcome-body">
      <h1>Kramps Games</h1>
      <p class="tagline">Games that look like work.</p>
      <p>Every game here runs in your browser and is dressed up as something you'd have open at the office: a terminal, a file browser, a notepad.</p>
      <p>There are no ads and no sign-ups. Open the Games folder to pick one.</p>
      <div class="welcome-actions">
        <a class="kg-btn kg-primary" href="games.html">Open Games</a>
        <button class="link" type="button" data-kg-open="settings">Change OS or theme</button>
      </div>
    </div>
  </div>
  <script>
    KG.makeWindow(document.getElementById('welcome'), {
      minW: 340,
      minH: 260,
      rect: (a) => {
        const w = Math.min(520, a.w - 60);
        const h = Math.min(340, a.h - 60);
        return { x: a.x + (a.w - w) / 2, y: a.y + (a.h - h) / 2.4, w, h };
      },
    });
  </script>
</body>
</html>
