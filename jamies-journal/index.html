<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jamie's Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window" id="term">
    <div class="titlebar" id="titlebar">
      <div class="lights"><span class="close"></span><span class="min"></span><span class="max"></span></div>
      <div class="window-title" id="window-title">jtaylor — journal</div>
    </div>
    <div id="screen">
      <header id="status"></header>
      <main id="view"></main>
      <footer id="hints"></footer>
    </div>
    <div class="grip n" data-edge="n"></div>
    <div class="grip s" data-edge="s"></div>
    <div class="grip e" data-edge="e"></div>
    <div class="grip w" data-edge="w"></div>
    <div class="grip ne" data-edge="ne"></div>
    <div class="grip nw" data-edge="nw"></div>
    <div class="grip se" data-edge="se"></div>
    <div class="grip sw" data-edge="sw"></div>
  </div>
  <script src="entries.js"></script>
  <script src="words.js"></script>
  <script src="window.js"></script>
  <script src="game.js"></script>
</body>
</html>
