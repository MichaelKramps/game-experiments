<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CorrMail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0d0d1a;
      color: #ffffff;
      font-family: monospace;
      height: 100%;
      overflow: hidden;
    }
    #back-link {
      color: #666;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    #back-link:hover { color: #44ff88; }

    #app {
      width: 100vw;
      height: 100vh;
      background: #12122080;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
    }
    #logo {
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: #44ff88;
      white-space: nowrap;
    }
    #coin-balance {
      font-size: 0.85rem;
      color: #44ff88;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    #search {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 8px 12px;
      color: #fff;
      font-family: monospace;
      font-size: 0.85rem;
    }
    #search:focus { outline: none; border-color: #44ff88; }
    #compose-btn {
      background: #44ff88;
      color: #0d0d1a;
      border: none;
      border-radius: 4px;
      padding: 9px 16px;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }
    #compose-btn:hover { background: #6bffa3; }

    #settings-wrapper { position: relative; }
    #settings-btn {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #ccc;
      border-radius: 4px;
      padding: 9px 14px;
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }
    #settings-btn:hover { border-color: #44ff88; color: #44ff88; }
    #settings-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 6px;
      z-index: 20;
      min-width: 160px;
    }
    #settings-menu button {
      width: 100%;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      color: #ff6b6b;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #settings-menu button:hover { border-color: #ff4466; background: #2a1420; }

    .hidden { display: none; }

    /* Body layout */
    #body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Nav sidebar */
    #nav {
      width: 170px;
      flex-shrink: 0;
      border-right: 1px solid #2a2a4a;
      padding: 12px 0;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      letter-spacing: 0.03em;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { color: #fff; background: #1a1a2e; }
    .nav-item.active {
      color: #44ff88;
      border-left-color: #44ff88;
      background: #1a1a2e;
    }
    .nav-item.unread { font-weight: bold; color: #fff; }
    .nav-item.unread.active { color: #44ff88; }
    .nav-item .count {
      font-size: 0.75rem;
      color: #666;
    }
    .nav-item.active .count { color: #44ff88; }
    .nav-item.locked { opacity: 0.4; cursor: default; }
    .nav-item.locked:hover { color: #aaa; background: transparent; }

    /* Message list */
    #list {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
    }
    .msg {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #1e1e33;
      cursor: pointer;
    }
    .msg:hover { background: #1a1a2e; }
    .msg.selected { background: #1e2a24; }
    .msg .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #44ff88;
      margin-top: 5px;
      flex-shrink: 0;
      visibility: hidden;
    }
    .msg.unread .dot { visibility: visible; }
    .msg .meta { flex: 1; min-width: 0; }
    .msg .row1 {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: #ccc;
    }
    .msg.unread .row1 .sender { color: #fff; font-weight: bold; }
    .msg .time { color: #666; font-size: 0.72rem; white-space: nowrap; }
    .msg .subject {
      font-size: 0.8rem;
      color: #999;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg.unread .subject { color: #ddd; }
    .msg .snippet {
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #list .empty {
      padding: 40px 16px;
      text-align: center;
      color: #555;
      font-size: 0.8rem;
    }

    /* Reading pane (also used for Corr Status / Marketplace / Hacking panels) */
    #reading {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      min-width: 0;
    }
    #reading .placeholder {
      color: #555;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 80px;
    }
    #reading h2 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    #reading .headers {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    #reading .from {
      font-size: 0.85rem;
      color: #44ff88;
    }
    #reading .to {
      font-size: 0.75rem;
      color: #666;
      margin-top: 2px;
    }
    #reading .date {
      font-size: 0.75rem;
      color: #666;
    }
    #reading .content {
      font-size: 0.85rem;
      line-height: 1.7;
      color: #ccc;
      white-space: pre-wrap;
    }
    #reading .content .term-cmd {
      display: inline-block;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 1px 6px;
      color: #44ff88;
      font-family: monospace;
    }
    #reading .actions {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #2a2a4a;
    }
    #reading .actions button {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #ccc;
      border-radius: 4px;
      padding: 7px 14px;
      font-family: monospace;
      font-size: 0.78rem;
      cursor: pointer;
    }
    #reading .actions button:hover { border-color: #44ff88; color: #44ff88; }
    #reading .actions button.danger:hover { border-color: #ff4466; color: #ff4466; }
    #reading .actions button.primary {
      background: #44ff88;
      color: #0d0d1a;
      font-weight: bold;
      border-color: #44ff88;
    }
    #reading .actions button.primary:hover {
      background: #6bffa3;
      color: #0d0d1a;
    }
    #reading .actions button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #reading .actions button.primary:disabled:hover {
      background: #44ff88;
    }
    #reading .actions button.progress-btn {
      position: relative;
      overflow: hidden;
      background: #1a1a2e;
      color: #ccc;
      border-color: #2a2a4a;
      opacity: 1;
      min-width: 140px;
    }
    #reading .actions button.progress-btn .fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: #1f4a30;
      z-index: 0;
    }
    #reading .actions button.progress-btn .label {
      position: relative;
      z-index: 1;
      color: #6bffa3;
    }

    /* Corr Status / Marketplace / Hacking panels */
    #reading .panel-section { margin-bottom: 20px; }
    #reading .panel-section h3 {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    #reading .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1e1e33;
      font-size: 0.85rem;
      color: #ccc;
    }
    #reading .stat-row.muted { color: #555; }
    #reading .power-meter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    #reading .power-score {
      font-size: 1rem;
      color: #888;
    }
    #reading .power-squares {
      display: flex;
      gap: 3px;
    }
    #reading .power-square {
      width: 10px;
      height: 10px;
      border: 1px solid #2a2a4a;
      border-radius: 2px;
      background: transparent;
    }
    #reading .power-square.filled {
      background: #44ff88;
      border-color: #44ff88;
    }
    #reading .market-row,
    #reading .hack-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #1e1e33;
      gap: 16px;
    }
    #reading .hack-row.locked { opacity: 0.5; }
    #reading .market-name,
    #reading .hack-name {
      font-size: 0.9rem;
      color: #fff;
      margin-bottom: 4px;
    }
    #reading .market-effect,
    #reading .hack-desc {
      font-size: 0.78rem;
      color: #888;
    }
    #reading .market-row button {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #ccc;
      border-radius: 4px;
      padding: 12px 24px;
      font-family: monospace;
      font-size: 0.78rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    #reading .market-row button:hover { border-color: #44ff88; color: #44ff88; }
    #reading .market-row button.primary {
      background: #44ff88;
      color: #0d0d1a;
      font-weight: bold;
      border-color: #44ff88;
    }
    #reading .market-row button.primary:hover {
      background: #6bffa3;
      color: #0d0d1a;
    }
    #reading .market-row button:disabled {
      background: #888;
      border-color: #44ff88;
      color: #666;
      opacity: 1;
      cursor: default;
    }
    #reading .market-row button.primary:disabled,
    #reading .market-row button.primary:disabled:hover {
      background: #888;
      border-color: #44ff88;
      color: #666;
    }

    @media (max-width: 860px) {
      #nav { width: 120px; }
      #list { width: 240px; }
    }
    @media (max-width: 680px) {
      #body { flex-direction: column; }
      #nav { width: 100%; border-right: none; border-bottom: 1px solid #2a2a4a; display: flex; overflow-x: auto; padding: 8px; }
      .nav-item { border-left: none; border-bottom: 3px solid transparent; flex-shrink: 0; }
      .nav-item.active { border-left-color: transparent; border-bottom-color: #44ff88; }
      #list { width: 100%; border-right: none; border-bottom: 1px solid #2a2a4a; max-height: 260px; }
    }

    /* Compose overlay */
    #compose-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000aa;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #compose-overlay.open { display: flex; }
    #compose-modal {
      width: 90%;
      max-width: 520px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    #compose-modal .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #12122a;
      border-bottom: 1px solid #2a2a4a;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: #44ff88;
    }
    #compose-modal .head span.close {
      color: #666;
      cursor: pointer;
      font-size: 1rem;
    }
    #compose-modal .head span.close:hover { color: #ff4466; }
    #compose-modal .fields { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    #compose-modal input, #compose-modal textarea {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 8px 10px;
      color: #fff;
      font-family: monospace;
      font-size: 0.82rem;
      width: 100%;
      resize: vertical;
    }
    #compose-modal input:focus, #compose-modal textarea:focus { outline: none; border-color: #44ff88; }
    #compose-modal .foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #2a2a4a;
    }
    #compose-modal .foot button {
      border-radius: 4px;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid #2a2a4a;
      background: #0d0d1a;
      color: #ccc;
    }
    #compose-modal .foot button.send {
      background: #44ff88;
      color: #0d0d1a;
      font-weight: bold;
      border-color: #44ff88;
    }
    #compose-modal .foot button.send:hover { background: #6bffa3; }
    #compose-modal .foot button.cancel:hover { border-color: #ff4466; color: #ff4466; }

    /* Terminal overlay — a floating window over the top of the UI, not a
       nav panel or a modal: no backdrop dimming, the UI underneath stays
       exactly as it looked before the window opened. */
    #terminal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
    }
    #terminal-overlay.open { display: block; }
    #terminal-window {
      position: fixed;
      left: 125px;
      top: 200px;
      width: 90%;
      max-width: 640px;
      height: 420px;
      background: #05070a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px #000000cc;
    }
    #terminal-window .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #12122a;
      border-bottom: 1px solid #2a2a4a;
      font-size: 0.8rem;
      color: #6bffa3;
      letter-spacing: 0.05em;
      cursor: grab;
      user-select: none;
    }
    #terminal-window .titlebar.dragging { cursor: grabbing; }
    #terminal-window .titlebar .close {
      color: #ff4466;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      font-weight: bold;
    }
    #terminal-window .titlebar .close:hover { color: #ff8899; }
    #terminal-window .body {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 0.85rem;
      color: #44ff88;
      line-height: 1.6;
    }
    #terminal-output { white-space: pre-wrap; }
    #terminal-output .error { color: #ff4466; }
    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .terminal-input-row .prompt { color: #44ff88; }
    #terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #44ff88;
      font-family: monospace;
      font-size: 0.85rem;
      caret-color: #44ff88;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <a id="back-link" href="../experiments.html">← back</a>
      <div id="logo">CorrMail</div>
      <div id="coin-balance">— CorrCoin</div>
      <input id="search" type="text" placeholder="Search mail...">
      <div id="settings-wrapper">
        <button id="settings-btn">Settings</button>
        <div id="settings-menu" class="hidden">
          <button id="reset-game-btn">Reset Game</button>
        </div>
      </div>
      <button id="compose-btn">Compose</button>
    </div>
    <div id="body">
      <div id="nav"></div>
      <div id="list"></div>
      <div id="reading"><div class="placeholder">Select a message to read it.</div></div>
    </div>
  </div>

  <div id="compose-overlay">
    <div id="compose-modal">
      <div class="head">
        <span>New Message</span>
        <span class="close" id="compose-close">&times;</span>
      </div>
      <div class="fields">
        <input id="compose-to" type="text" placeholder="To">
        <input id="compose-subject" type="text" placeholder="Subject">
        <textarea id="compose-body" rows="8" placeholder="Write your message..."></textarea>
      </div>
      <div class="foot">
        <button class="cancel" id="compose-cancel">Cancel</button>
        <button class="send" id="compose-send">Send</button>
      </div>
    </div>
  </div>

  <div id="terminal-overlay">
    <div id="terminal-window">
      <div class="titlebar">
        <span>corr@terminal</span>
        <span class="close" id="terminal-close">&times;</span>
      </div>
      <div class="body">
        <div id="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="prompt">&gt;</span>
          <input id="terminal-input" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
